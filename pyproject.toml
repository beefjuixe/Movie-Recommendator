[project]
name = "movie-recommender"
version = "0.1.0"
description = ""
authors = [
    {name = "Rajasekar S",email = "mithunj09@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "scikit-learn (>=1.7.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "movie_recommender", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
movie-recommender = "movie_recommender.main:main"